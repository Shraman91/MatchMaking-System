[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "0.15.7"
env_logger = "0.11"
log = "0.4.34"
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.0", features = ["v4"] }
